<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Масла</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            color: var(--tg-theme-text-color, #222);
            background: var(--tg-theme-bg-color, #f5f5f5);
        }
        #search {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        #search:focus { border-color: #4a90d9; }
        .oil-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 10px;
        }
        .oil-name { font-size: 15px; flex: 1; }
        .oil-pv { font-size: 13px; color: #888; margin-left: 8px; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn {
            width: 32px; height: 32px;
            border: none; border-radius: 8px;
            background: #4a90d9; color: #fff;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .qty-btn:active { opacity: 0.7; }
        .qty-btn.minus { background: #e05a5a; }
        .qty-val {
            min-width: 32px; text-align: center;
            font-size: 15px; font-weight: 600;
        }
        #summary {
            position: sticky; bottom: 0;
            background: var(--tg-theme-bg-color, #f5f5f5);
            padding: 12px 0; margin-top: 8px;
        }
        #total { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
        #submit {
            width: 100%;
            padding: 14px;
            border: none; border-radius: 12px;
            background: var(--tg-theme-button-color, #4a90d9);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px; font-weight: 600;
            cursor: pointer;
        }
        #submit:active { opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <input type="text" id="search" placeholder="Поиск масла..." oninput="filterOils()">
    <div id="oil-list"></div>
    <div id="summary">
        <div id="total">Выбрано: 0 PV</div>
        <button id="submit" onclick="submitData()">Готово</button>
    </div>

    <script>
        const PROD = {
            'базилик': 36, 'бергамот': 44, 'берёза': 49, 'чёрная ель': 23,
            'голубая пижма': 89, 'кардамон': 34, 'кассия': 21, 'кедр': 17,
            'сельдерей': 42, 'кинза': 30, 'корица': 39, 'цитронелла': 23,
            'шалфей мускатный': 43, 'гвоздика': 22, 'копайба': 43,
            'копайба touch': 30, 'кориандр': 29, 'кипарис': 21,
            'дугласова пихта': 26, 'фенхель': 20, 'ладан': 82,
            'ладан touch': 57, 'герань': 55, 'имбирь': 57,
            'грейпфрут': 22, 'зелёный мандарин': 33, 'гваяковое дерево': 22,
            'бессмертник touch': 57, 'бессмертник': 80, 'жасмин': 107,
            'жасмин touch': 52, 'можжевельник': 25, 'лаванда': 31,
            'лаванда touch': 22, 'лимон': 17, 'лимонный эвкалипт': 18,
            'лемонграсс': 16, 'лайм': 18, 'мадагаскарская ваниль': 44,
            'майоран': 26, 'мелисса': 95, 'мирра': 68,
            'нероли touch': 51, 'орегано': 31, 'орегано touch': 21,
            'пачули': 36, 'перечная мята': 28, 'перечная мята touch': 22,
            'перечная мята в гранулах': 19, 'петитгрейн': 30,
            'розовый перец': 25, 'римская ромашка': 57, 'роза touch': 74,
            'розмарин': 22, 'гавайское сандаловое дерево': 71,
            'сибирская пихта': 23, 'испанский шалфей': 32,
            'садовая мята': 34, 'нард': 57, 'мандарин': 18,
            'чайное дерево': 28, 'чайное дерево touch': 19,
            'тимьян': 37, 'куркума': 37, 'тулси': 34,
            'ветивер': 66, 'ветивер touch': 44, 'дикий апельсин': 14,
            'туя': 26, 'иланг-иланг': 48
        };

        const quantities = {};
        const allNames = Object.keys(PROD).sort();
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function renderList(filter) {
            const list = document.getElementById('oil-list');
            list.innerHTML = '';
            for (const name of allNames) {
                if (filter && !name.toLowerCase().includes(filter.toLowerCase())) continue;
                const pv = PROD[name];
                const qty = quantities[name] || 0;
                const item = document.createElement('div');
                item.className = 'oil-item';
                item.innerHTML = `
                    <span class="oil-name">${name}<span class="oil-pv">(${pv} PV)</span></span>
                    <div class="qty-controls">
                        <button class="qty-btn minus" onclick="changeQty('${name}', -1)">−</button>
                        <span class="qty-val">${qty}</span>
                        <button class="qty-btn" onclick="changeQty('${name}', 1)">+</button>
                    </div>
                `;
                list.appendChild(item);
            }
        }

        function changeQty(name, delta) {
            const cur = quantities[name] || 0;
            const next = Math.max(0, cur + delta);
            quantities[name] = next;
            renderList(document.getElementById('search').value);
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            for (const [name, qty] of Object.entries(quantities)) {
                if (qty > 0) total += PROD[name] * qty;
            }
            document.getElementById('total').textContent = `Выбрано: ${total} PV`;
        }

        function filterOils() {
            renderList(document.getElementById('search').value);
        }

        function submitData() {
            const selected = {};
            for (const [name, qty] of Object.entries(quantities)) {
                if (qty > 0) selected[name] = qty;
            }

            if (Object.keys(selected).length === 0) {
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            tg.HapticFeedback.notificationOccurred('success');

            // КЛЮЧЕВОЙ МОМЕНТ: sendData работает только при открытии
            // через inline-кнопку с web_app
            tg.sendData(JSON.stringify(selected));
        }

        renderList('');
    </script>
</body>
</html>
